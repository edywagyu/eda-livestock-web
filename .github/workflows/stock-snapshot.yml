# ============================================================
# 在庫スナップショット（public/data/stock-snapshot.json）の自動更新
# ------------------------------------------------------------
# なぜ要るか:
#   GASウェブアプリは必ず Google のリダイレクトを1回通るので、どれだけ
#   GAS側を速くしても 1.8〜4秒かかる。会員限定ページが「在庫を確認しています」
#   を出したまま固まるのはこれが原因。
#   同じ在庫の中身を eda-livestock.com（GitHub Pages / CDN）から配ると
#   0.1秒以下で届くので、画面はそちらで先に確定させる。
#
# 🔴 10分おきにしてある理由:
#   GitHub Pages の「ブランチから公開」は1時間あたり10ビルドのソフト上限がある。
#   1〜2分おきにすると上限に当たってビルドが止まり、かえって古くなる。
#   中身が変わっていないときはコミットしないので、実際のビルドはもっと少ない。
#   表示が最大20分古くなりうるが、
#     ・ページは裏で必ずGASの実在庫を取りに行って上書きする（数秒で揃う）
#     ・レジは validateStockBeforeCheckout がシートの実在庫を見る
#   ので、売り越しの最後の砦はこれまでどおり。
#
# 🔴 止まったときに気づく仕掛け（3つ）:
#   1. このワークフローが失敗すると GitHub からリポジトリの管理者へメールが飛ぶ
#   2. JSON に generatedAt が入っている。フロントは古すぎる（既定45分）と
#      スナップショットを捨てて従来どおりGASを待つ＝古い在庫は出ない
#   3. そのとき stock_snapshot_stale を1回だけ log_event する
#      （本番EC DB の events タブに残る）
# ============================================================
name: stock snapshot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GASから在庫を取得してJSONを書き出す
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbx7u3D5mMFGW4FMTLy5eeH6BjOtnSuzIzEmjtHu5hy7O8YcPpeou3DJyyesuffDHTFFyQ/exec?action=public_catalog'
          # 失敗したら古いファイルを残したまま異常終了する（壊れたJSONで上書きしない）
          for i in 1 2 3; do
            if curl -sSL --max-time 60 "$URL" -o /tmp/catalog.json; then break; fi
            echo "retry $i"; sleep 10
          done
          python3 - <<'PY'
          import json, datetime, sys, pathlib
          raw = json.load(open('/tmp/catalog.json'))
          if not isinstance(raw, dict) or raw.get('ok') is not True:
              sys.exit('public_catalog が ok:true を返していない。更新せず終了する。')
          products = raw.get('products') or []
          if not isinstance(products, list) or len(products) < 10:
              sys.exit('products が %s 件しかない。壊れた応答とみなして更新しない。' % len(products))

          # 🔴 壊れた応答（列ズレで stock が欠ける／全部0）をCDNに載せないための歯止め。
          #    ここを通さないと、間違った「完売」が最大45分 全ページに配られる。
          def stock_of(p):
              try: return float(p.get('stock') or 0)
              except Exception: return 0.0
          total = sum(stock_of(p) for p in products)
          if total <= 0:
              sys.exit('在庫の合計が0。列ズレか取得失敗とみなして更新しない。')

          zero_now = sum(1 for p in products if stock_of(p) <= 0)
          old_path = pathlib.Path('public/data/stock-snapshot.json')
          if old_path.exists():
              try:
                  prev = json.loads(old_path.read_text(encoding='utf-8')).get('products') or []
                  zero_prev = sum(1 for p in prev if stock_of(p) <= 0)
                  if zero_now - zero_prev > 20:
                      sys.exit('在庫0の点数が %d → %d と急に増えた。異常とみなして更新しない。' % (zero_prev, zero_now))
              except SystemExit:
                  raise
              except Exception as e:
                  print('前回ぶんの比較に失敗（続行）:', e)
          print('在庫合計:', total, '／在庫0の点数:', zero_now, '/', len(products))

          out = {
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),
              'source': 'public_catalog',
              'ok': True,
              'products': products,
              'gifts': raw.get('gifts') or [],
              'plans': raw.get('plans') or [],
          }
          p = old_path
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('products:', len(products))
          PY

      - name: 中身が変わっていたらコミット
        run: |
          set -euo pipefail
          # generatedAt だけの差分では commit しない（Pages のビルド回数を使い切らないため）
          if git diff --quiet -- public/data/stock-snapshot.json; then
            echo 'no change'; exit 0
          fi
          OLD=$(git show HEAD:public/data/stock-snapshot.json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);d.pop('generatedAt',None);print(json.dumps(d,ensure_ascii=False,sort_keys=True))" 2>/dev/null || echo '')
          NEW=$(python3 -c "import json;d=json.load(open('public/data/stock-snapshot.json'));d.pop('generatedAt',None);print(json.dumps(d,ensure_ascii=False,sort_keys=True))")
          # 🔴 中身が同じでも、置いてある控えが20分より古くなったら時刻だけ打ち直す（2026-11-15 本番で判明）。
          #    サイト側は generatedAt が45分より古い控えを「止まっている」とみなして使わない。
          #    在庫が動かない時間帯（夜間・平日の昼）は中身が変わらないので、中身の差分だけで
          #    コミットを判断すると45分で勝手に期限切れになり、せっかくの高速化が効かなくなる。
          #    20分ごとなら Pages のビルドは最大でも毎時3回（在庫が動く時間帯と合わせて6回）。
          AGE_MIN=$(git show HEAD:public/data/stock-snapshot.json 2>/dev/null | python3 -c "
          import sys,json,datetime
          try:
              g=json.load(sys.stdin).get('generatedAt','')
              d=datetime.datetime.strptime(g,'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)
              print(int((datetime.datetime.now(datetime.timezone.utc)-d).total_seconds()//60))
          except Exception:
              print(9999)
          " 2>/dev/null || echo 9999)
          echo "置いてある控えの古さ: ${AGE_MIN}分"
          if [ "$OLD" = "$NEW" ] && [ "$AGE_MIN" -lt 20 ]; then
            echo '在庫・価格に変化なし、控えもまだ新しい。コミットしない。'
            git checkout -- public/data/stock-snapshot.json
            exit 0
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo '在庫・価格に変化なしだが控えが古いので、時刻だけ打ち直す。'
          fi
          git config user.name  'eda-stock-bot'
          git config user.email 'actions@github.com'
          git add public/data/stock-snapshot.json
          git commit -m "在庫スナップショットを更新"
          git push
