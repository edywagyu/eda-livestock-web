<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDA Staff">
<meta name="theme-color" content="#0F3D2E">
<link rel="manifest" href="staff-manifest.json">
<link rel="apple-touch-icon" href="public/images/logo/eda-livestock-logo-transparent.png">
<title>江田畜産 STAFF</title>
<style>
:root {
  --forest: #0F3D2E;
  --forest-deep: #0A2D21;
  --gold: #D4A93B;
  --gold-soft: #B8932F;
  --cream: #FAF7F0;
  --paper: #F5EFE3;
  --bone: #EFE8D7;
  --ink: #1A1A1A;
  --muted: #5C5C5C;
  --red: #C8102E;
  --green: #06C755;
  --amber: #F0AD4E;
  --blue: #3498DB;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: #f5f5f7;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: 0; cursor: pointer; padding: 0; }
input { -webkit-appearance: none; appearance: none; }
ul { list-style: none; padding: 0; margin: 0; }

/* ============ APP SHELL ============ */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #f5f5f7;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ============ TOP BAR ============ */
.topbar {
  background: var(--forest);
  color: #fff;
  padding: calc(var(--safe-top) + 14px) 18px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.topbar h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar h1 small { font-size: 10px; opacity: 0.6; font-weight: 400; }
.topbar-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  cursor: pointer;
  transition: background .15s;
}
.topbar-icon:active { background: rgba(255,255,255,.2); }

/* ============ MAIN AREA ============ */
.main {
  flex: 1;
  padding: 16px;
  padding-bottom: calc(80px + var(--safe-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ============ BOTTOM TAB ============ */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,.08);
  padding: 6px 0 calc(6px + var(--safe-bottom));
  display: flex;
  z-index: 40;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px;
  color: var(--muted);
  cursor: pointer;
  transition: color .15s;
}
.tab svg { width: 22px; height: 22px; transition: transform .15s; }
.tab span { font-size: 10px; font-weight: 600; }
.tab.active { color: var(--forest); }
.tab.active svg { transform: scale(1.05); color: var(--gold); }
.tab:active { color: var(--forest-deep); }

/* ============ CARDS ============ */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.card-row { padding: 14px 18px; margin: 0 0 12px; }
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  padding: 0 4px 8px;
  margin-top: 4px;
}

/* ============ STAT GRID ============ */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.stat {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--forest);
  line-height: 1;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.stat-num.urgent { color: var(--red); }
.stat-num.success { color: var(--green); }

/* ============ INVENTORY ============ */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.search-bar svg { color: var(--muted); flex-shrink: 0; }
.search-bar input {
  flex: 1;
  border: 0;
  outline: 0;
  font-size: 15px;
  background: transparent;
}

.product-row {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.product-info {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.product-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
}
.product-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.product-status {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 8px;
  white-space: nowrap;
  margin-left: 8px;
}
.ps-ok { background: #d4edda; color: #155724; }
.ps-low { background: #fff3cd; color: #664d03; }
.ps-out { background: #f8d7da; color: #721c24; }

.stock-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.stock-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--paper);
  color: var(--forest);
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, transform .1s;
}
.stock-btn:active { background: var(--bone); transform: scale(0.94); }
.stock-input {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--forest);
  border: 1.5px solid var(--bone);
  border-radius: 10px;
  padding: 8px 4px;
  background: #fff;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.stock-input::-webkit-outer-spin-button,
.stock-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stock-save {
  padding: 0 16px;
  height: 40px;
  background: var(--forest);
  color: #fff;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all .15s;
}
.stock-save:active { background: var(--forest-deep); transform: scale(0.96); }
.stock-save.saved { background: var(--green); }

/* ============ ORDER ROWS ============ */
.order-row {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  display: flex;
  align-items: center;
  gap: 12px;
}
.order-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  flex-shrink: 0;
}
.order-icon.shipped { background: #d4edda; color: #155724; }
.order-icon.pending { background: #fff3cd; color: #664d03; }
.order-body { flex: 1; min-width: 0; }
.order-id {
  font-size: 13px;
  font-weight: 700;
  color: var(--forest);
  font-variant-numeric: tabular-nums;
}
.order-name {
  font-size: 13px;
  color: var(--ink);
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.order-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.order-arrow { color: var(--muted); flex-shrink: 0; }

/* ============ SHIP DETAIL ============ */
.detail-card {
  background: #fff;
  border-radius: 14px;
  padding: 24px 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--bone);
  font-size: 14px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .label { color: var(--muted); font-size: 12px; }
.detail-row .value { font-weight: 600; color: var(--ink); text-align: right; max-width: 60%; }

.tracking-input {
  width: 100%;
  padding: 16px 18px;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  border: 2px solid var(--gold);
  border-radius: 12px;
  background: #fff;
  text-align: center;
  letter-spacing: 0.08em;
  margin-top: 8px;
}
.tracking-input:focus { outline: 0; border-color: var(--forest); }

.btn-primary {
  width: 100%;
  padding: 16px;
  background: var(--forest);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  margin-top: 16px;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:active { background: var(--forest-deep); transform: scale(0.99); }
.btn-primary:disabled { opacity: 0.5; }
.btn-primary.loading { background: var(--muted); }

.btn-csv {
  width: 100%;
  padding: 16px;
  background: var(--gold);
  color: var(--forest-deep);
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-csv:active { background: var(--gold-soft); }

/* ============ LOGIN ============ */
.login-screen {
  position: fixed;
  inset: 0;
  background: var(--forest);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 32px;
  color: #fff;
}
.login-logo {
  width: 84px; height: 84px;
  margin-bottom: 12px;
  filter: brightness(0) invert(1);
}
.login-brand {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
.login-sub { font-size: 12px; opacity: 0.6; margin-bottom: 32px; }
.pin-display {
  display: flex;
  gap: 16px;
  margin-bottom: 28px;
}
.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3);
  transition: all .15s;
}
.pin-dot.filled { background: var(--gold); border-color: var(--gold); }
.pin-dot.error { background: var(--red); border-color: var(--red); animation: shake .3s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  gap: 14px;
  margin-bottom: 24px;
}
.numpad-btn {
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 24px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .1s;
}
.numpad-btn:active { background: rgba(255,255,255,.2); transform: scale(0.94); }
.numpad-btn.del { background: transparent; }
.login-hint { font-size: 11px; opacity: 0.5; }

/* ============ SETTINGS PANEL ============ */
.settings-panel {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.settings-panel.open { display: flex; }
.settings-sheet {
  background: #fff;
  width: 100%;
  max-width: 480px;
  border-radius: 16px 16px 0 0;
  padding: 8px 0 calc(20px + var(--safe-bottom));
  animation: slideUp .25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.settings-handle {
  width: 36px; height: 4px;
  background: rgba(0,0,0,.15);
  border-radius: 2px;
  margin: 0 auto 12px;
}
.settings-item {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--bone);
  cursor: pointer;
  transition: background .1s;
}
.settings-item:active { background: var(--paper); }
.settings-item:last-child { border-bottom: none; }
.settings-item-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.settings-item-text { flex: 1; }
.settings-item-title { font-size: 14px; font-weight: 600; }
.settings-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: calc(96px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15,61,46,.95);
  color: #fff;
  padding: 12px 20px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease-out;
  z-index: 300;
  white-space: nowrap;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ============ EMPTY STATE ============ */
.empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 13px; }

/* ============ PULL-TO-REFRESH SUBSTITUTE ============ */
.refresh-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 0 0 14px;
  padding: 8px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.refresh-btn:active { color: var(--forest); }

/* ============ SETUP PROMPT ============ */
.setup-card {
  background: #fff3cd;
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.6;
}
.setup-card h3 { margin: 0 0 8px; font-size: 14px; color: #664d03; }
.setup-card input { width: 100%; padding: 10px; border: 1.5px solid var(--gold); border-radius: 8px; font-size: 13px; margin: 8px 0; font-family: 'SF Mono', Menlo, monospace; }
.setup-card button { padding: 10px 16px; background: var(--forest); color: #fff; border-radius: 8px; font-weight: 600; }

/* ============ HIDE/SHOW SECTIONS ============ */
.section { display: none; }
.section.active { display: block; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <img src="public/images/logo/eda-livestock-logo-transparent.png" class="login-logo" alt="">
  <div class="login-brand">EDA STAFF</div>
  <div class="login-sub">江田畜産 業務管理</div>

  <div class="pin-display" id="pinDisplay">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>

  <div class="numpad" id="numpad">
    <button class="numpad-btn" data-key="1">1</button>
    <button class="numpad-btn" data-key="2">2</button>
    <button class="numpad-btn" data-key="3">3</button>
    <button class="numpad-btn" data-key="4">4</button>

    <button class="numpad-btn" data-key="6">6</button>

    <button class="numpad-btn" data-key="8">8</button>
    <button class="numpad-btn" data-key="9">9</button>

    <button class="numpad-btn del" data-key="del">⌫</button>

  <div class="login-hint" id="loginHint">4桁のPINを入力</div>
  <div style="font-size:10px;opacity:0.4;margin-top:8px">デモ体験は <strong style="color:var(--gold);opacity:1">1234</strong></div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">

  <!-- DEMO BANNER -->

    🎭 デモモード — 表示はサンプル / 保存は無効

  <!-- TOP BAR -->

      <span>江田畜産 STAFF</span>
    </h1>
    <button class="topbar-icon" id="settingsBtn" aria-label="設定">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">

    <!-- ============ HOME ============ -->
    <section class="section active" id="sec-home">
      <div class="section-label">今日の状況</div>

      <div class="stat-grid">

        <div class="stat">

          <div class="stat-label">未発送</div>

        <div class="stat">
          <div class="stat-num success" id="todayRevenue">-</div>
          <div class="stat-label">今日の売上</div>

        <div class="stat">
          <div class="stat-num" id="lowStock">-</div>
          <div class="stat-label">在庫低品目</div>
        </div>
      </div>

      <div class="section-label">クイックアクション</div>
      <div class="card" style="padding:6px 0">
        <div class="settings-item" onclick="switchTab('inv')">

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ================ STATE ================ */
const STAFF_PIN_KEY = 'eda-staff-pin';
const GAS_URL_KEY   = 'eda-staff-gas-url';
const SESSION_KEY   = 'eda-staff-session';

let GAS_URL = localStorage.getItem(GAS_URL_KEY) || '';
let pinBuffer = '';
let inventoryCache = [];
let ordersCache = [];
let selectedOrder = null;

/* ================ TOAST ================ */
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 2200);
}

/* ================ LOGIN ================ */
document.querySelectorAll('.numpad-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.key;
    if (key === 'del') {
      pinBuffer = pinBuffer.slice(0, -1);
    } else if (key === 'setup') {
      // Open settings even before login
      const url = prompt('GAS Web App URL を入力してください:', GAS_URL);
      if (url) {
        GAS_URL = url.trim();
        localStorage.setItem(GAS_URL_KEY, GAS_URL);
        toast('保存しました', 'success');
      }
      return;
    } else {
      if (pinBuffer.length < 4) pinBuffer += key;
    }
    renderPin();
    if (pinBuffer.length === 4) checkPin();
  });
});

function renderPin() {
  document.querySelectorAll('.pin-dot').forEach((d, i) => {
    d.classList.toggle('filled', i < pinBuffer.length);
    d.classList.remove('error');
  });
}

async function checkPin() {
  // GAS未接続 → デモモード（PIN 1234）
  if (!GAS_URL) {
    if (pinBuffer === '1234') {
      sessionStorage.setItem('eda-staff-demo', '1');
      localStorage.setItem(SESSION_KEY, '1');
      enterApp();
    } else {
      showPinError('デモモード: PINは 1234');
    }
    return;
  }
  // GAS接続 → サーバー認証
  try {
    const res = await fetch(GAS_URL + '?action=staff_login&pin=' + pinBuffer);
    const data = await res.json();
    if (data.success) {
      sessionStorage.removeItem('eda-staff-demo');
      localStorage.setItem(SESSION_KEY, '1');
      enterApp();
    } else {
      showPinError(data.error || 'PINが違います');
    }
  } catch (e) {
    // 接続失敗時もデモモードフォールバック
    if (pinBuffer === '1234') {
      sessionStorage.setItem('eda-staff-demo', '1');
      localStorage.setItem(SESSION_KEY, '1');
      enterApp();
    } else {
      showPinError('接続エラー — PIN 1234 でデモ');
    }
  }
}

function isDemoMode() {
  return sessionStorage.getItem('eda-staff-demo') === '1' || !GAS_URL;
}

function showPinError(msg) {
  document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('error'));
  document.getElementById('loginHint').textContent = msg;
  setTimeout(() => {
    pinBuffer = '';
    renderPin();
    document.getElementById('loginHint').textContent = '4桁のPINを入力';
  }, 1200);
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('demoBanner').style.display = isDemoMode() ? 'block' : 'none';
  loadDashboard();
}

/* ================ DEMO DATA ================ */
const DEMO_PRODUCTS = [
  { variantId: 'WAGYU-SL-500', name: '宮崎和牛 サーロイン', variant: '500g', price: 12800, stock: 12, temp: '冷凍' },
  { variantId: 'WAGYU-RB-300', name: '宮崎和牛 リブロース', variant: '300g', price: 9800, stock: 4, temp: '冷凍' },
  { variantId: 'WAGYU-FL-200', name: '宮崎和牛 ヒレ', variant: '200g', price: 11500, stock: 7, temp: '冷凍' },
  { variantId: 'WAGYU-RP-300', name: '宮崎和牛 ランプ', variant: '300g', price: 7800, stock: 15, temp: '冷凍' },
  { variantId: 'CHK-MM-1KG',  name: '大分平飼い鶏 もも肉', variant: '1kg', price: 2400, stock: 25, temp: '冷凍' },
  { variantId: 'CHK-MN-1KG',  name: '大分平飼い鶏 むね肉', variant: '1kg', price: 1800, stock: 0,  temp: '冷凍' },
  { variantId: 'CHK-TB-500',  name: '大分平飼い鶏 手羽先', variant: '500g', price: 1200, stock: 9,  temp: '冷凍' }
];
const DEMO_ORDERS = [
  { id: '#1023', customerName: '田中 太郎', total: 15400, items: '宮崎和牛サーロイン 500g / 平飼い鶏もも 1kg', shipStatus: '未発送', phone: '0901234567', zip: '1500001', address: '東京都渋谷区神宮前1-2-3', address2: '' },
  { id: '#1022', customerName: '佐藤 花子', total: 12800, items: '宮崎和牛サーロイン 500g', shipStatus: '未発送', phone: '0809876543', zip: '5300001', address: '大阪府大阪市北区梅田2-2', address2: 'マンション101' },
  { id: '#1021', customerName: '鈴木 一郎', total: 9800,  items: '宮崎和牛リブロース 300g', shipStatus: '未発送', phone: '0701112233', zip: '4600001', address: '愛知県名古屋市中区栄3-4-5', address2: '' },
  { id: '#1020', customerName: '山田 美香', total: 4800,  items: '平飼い鶏もも 2kg', shipStatus: '発送済', phone: '0805556677', zip: '8120011', address: '福岡県福岡市博多区博多駅前2-1', address2: '', tracking: '1234-5678-9012' },
  { id: '#1019', customerName: '中村 健', total: 11500, items: '宮崎和牛 ヒレ 200g', shipStatus: '配達完了', phone: '0903334455', zip: '1500041', address: '東京都渋谷区神南1-1-1', address2: '', tracking: '0987-6543-2109' }
];

function logout() {
  localStorage.removeItem(SESSION_KEY);
  pinBuffer = '';
  renderPin();
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  closeSettings();
}

/* ================ TABS ================ */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));

  if (tab === 'home') loadDashboard();
  if (tab === 'inv') loadInventory();
  if (tab === 'orders') loadOrders();
  if (tab === 'ship' && !selectedOrder) renderShipEmpty();

  window.scrollTo(0, 0);
}

/* ================ SETTINGS ================ */
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('gasUrlSettingInput').value = GAS_URL;
  document.getElementById('settingsPanel').classList.add('open');
});
function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
}
function saveGasUrl() {
  const v = document.getElementById('gasUrlSettingInput').value.trim();
  if (!v.startsWith('https://')) { toast('正しいURL形式で入力', 'error'); return; }
  GAS_URL = v;
  localStorage.setItem(GAS_URL_KEY, v);
  toast('保存しました', 'success');
  closeSettings();
}

/* ================ DASHBOARD ================ */
async function loadDashboard() {
  if (isDemoMode()) {
    document.getElementById('todayOrders').textContent = '5';
    document.getElementById('pendingShip').textContent = '3';
    document.getElementById('todayRevenue').textContent = '¥152k';
    document.getElementById('lowStock').textContent = '2';
    return;
  }
  try {
    const res = await fetch(GAS_URL + '?action=staff_dashboard');
    const data = await res.json();
    document.getElementById('todayOrders').textContent = data.todayOrders || 0;
    document.getElementById('pendingShip').textContent = data.pendingShip || 0;
    document.getElementById('todayRevenue').textContent = '¥' + Math.round((data.todayRevenue || 0) / 1000) + 'k';
    document.getElementById('lowStock').textContent = data.lowStock || 0;
  } catch (e) {
    console.error(e);
  }
}

/* ================ INVENTORY ================ */
async function loadInventory() {
  const list = document.getElementById('invList');

  if (isDemoMode()) {
    inventoryCache = JSON.parse(JSON.stringify(DEMO_PRODUCTS));
    renderInventory();
    return;
  }

  list.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const res = await fetch(GAS_URL + '?action=staff_inventory');
    const data = await res.json();
    inventoryCache = data.products || [];
    renderInventory();
  } catch (e) {
    list.innerHTML = '<div class="empty">読み込み失敗: ' + e.message + '</div>';
  }
}

function renderInventory(filter) {
  const list = document.getElementById('invList');
  const q = (filter || document.getElementById('invSearch').value || '').toLowerCase();
  const filtered = inventoryCache.filter(p =>
    !q || (p.name || '').toLowerCase().includes(q) || (p.variant || '').toLowerCase().includes(q)
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">商品がありません</div></div>';
    return;
  }

  list.innerHTML = filtered.map((p, idx) => {
    const stock = parseInt(p.stock) || 0;
    const cls = stock === 0 ? 'ps-out' : (stock < 5 ? 'ps-low' : 'ps-ok');
    const label = stock === 0 ? '在庫切れ' : (stock < 5 ? '残少' : '在庫あり');
    return `
      <div class="product-row">
        <div class="product-info">
          <div>
            <div class="product-name">${escapeHtml(p.name || '')}${p.variant ? ' / ' + escapeHtml(p.variant) : ''}</div>
            <div class="product-meta">¥${Number(p.price || 0).toLocaleString()} · ${escapeHtml(p.temp || '')}</div>
          </div>
          <span class="product-status ${cls}">${label}</span>
        </div>
        <div class="stock-controls">
          <button class="stock-btn" onclick="adjustStock('${p.variantId}', -1)">−</button>
          <input type="number" class="stock-input" id="stk-${p.variantId}" value="${stock}" min="0" inputmode="numeric">
          <button class="stock-btn" onclick="adjustStock('${p.variantId}', 1)">+</button>
          <button class="stock-save" onclick="saveStock('${p.variantId}', this)">保存</button>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('invSearch').addEventListener('input', e => renderInventory(e.target.value));

function adjustStock(variantId, delta) {
  const input = document.getElementById('stk-' + variantId);
  const cur = parseInt(input.value) || 0;
  const next = Math.max(0, cur + delta);
  input.value = next;
}

async function saveStock(variantId, btn) {
  const input = document.getElementById('stk-' + variantId);
  const val = parseInt(input.value) || 0;
  btn.disabled = true;
  btn.textContent = '保存中';

  // Demo mode: 表示だけ更新
  if (isDemoMode()) {
    setTimeout(() => {
      btn.textContent = '✓ デモ';
      btn.classList.add('saved');
      const item = inventoryCache.find(p => p.variantId === variantId);
      if (item) item.stock = val;
      toast('🎭 デモ: 実際は保存されません', 'success');
      setTimeout(() => { btn.textContent = '保存'; btn.classList.remove('saved'); btn.disabled = false; }, 1500);
    }, 400);
    return;
  }

  try {
    const res = await fetch(GAS_URL + '?action=staff_update_stock', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ variantId, stock: val })
    });
    const data = await res.json();
    if (data.success) {
      btn.textContent = '✓ 完了';
      btn.classList.add('saved');
      setTimeout(() => { btn.textContent = '保存'; btn.classList.remove('saved'); btn.disabled = false; }, 1500);
      const item = inventoryCache.find(p => p.variantId === variantId);
      if (item) item.stock = val;
      toast('在庫を更新しました', 'success');
    } else {
      throw new Error(data.error || '保存失敗');
    }
  } catch (e) {
    btn.textContent = '保存';
    btn.disabled = false;
    toast('エラー: ' + e.message, 'error');
  }
}

/* ================ ORDERS ================ */
async function loadOrders() {
  const list = document.getElementById('orderList');

  if (isDemoMode()) {
    ordersCache = JSON.parse(JSON.stringify(DEMO_ORDERS));
    renderOrders();
    return;
  }

  list.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const res = await fetch(GAS_URL + '?action=staff_orders');
    const data = await res.json();
    ordersCache = data.orders || [];
    renderOrders();
  } catch (e) {
    list.innerHTML = '<div class="empty">読み込み失敗: ' + e.message + '</div>';
  }
}

function renderOrders() {
  const list = document.getElementById('orderList');
  if (ordersCache.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">注文がありません</div></div>';
    return;
  }

  list.innerHTML = ordersCache.map(o => {
    const isShipped = o.shipStatus === '発送済' || o.shipStatus === '配達完了';
    const cls = isShipped ? 'shipped' : 'pending';
    const icon = isShipped
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    return `
      <div class="order-row" onclick="selectOrder('${o.id}')">
        <div class="order-icon ${cls}">${icon}</div>
        <div class="order-body">
          <div class="order-id">${escapeHtml(o.id || '')}</div>
          <div class="order-name">${escapeHtml(o.customerName || '')} · ¥${Number(o.total || 0).toLocaleString()}</div>
          <div class="order-meta">${escapeHtml((o.items || '').slice(0, 32))}${(o.items || '').length > 32 ? '...' : ''}</div>
        </div>
        <svg class="order-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    `;
  }).join('');
}

/* ================ SHIP ================ */
function selectOrder(orderId) {
  selectedOrder = ordersCache.find(o => o.id === orderId);
  if (!selectedOrder) return;
  switchTab('ship');
  renderShipDetail();
}

function renderShipEmpty() {
  document.getElementById('shipLabel').textContent = '発送処理';
  document.getElementById('shipContent').innerHTML =
    '<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">「注文一覧」から処理する注文を選択してください</div></div>';
}

function renderShipDetail() {
  const o = selectedOrder;
  const isShipped = o.shipStatus === '発送済' || o.shipStatus === '配達完了';

  document.getElementById('shipLabel').textContent = '発送処理 ' + o.id;
  document.getElementById('shipContent').innerHTML = `
    <div class="detail-card">
      <div class="detail-row"><span class="label">受注ID</span><span class="value">${escapeHtml(o.id)}</span></div>
      <div class="detail-row"><span class="label">顧客名</span><span class="value">${escapeHtml(o.customerName || '')}</span></div>
      <div class="detail-row"><span class="label">電話</span><span class="value">${escapeHtml(o.phone || '')}</span></div>
      <div class="detail-row"><span class="label">郵便番号</span><span class="value">${escapeHtml(o.zip || '')}</span></div>
      <div class="detail-row"><span class="label">住所</span><span class="value">${escapeHtml((o.address || '') + ' ' + (o.address2 || ''))}</span></div>
      <div class="detail-row"><span class="label">商品</span><span class="value">${escapeHtml(o.items || '')}</span></div>
      <div class="detail-row"><span class="label">合計</span><span class="value">¥${Number(o.total || 0).toLocaleString()}</span></div>
      <div class="detail-row"><span class="label">配送STS</span><span class="value">${escapeHtml(o.shipStatus || '')}</span></div>
      ${o.tracking ? `<div class="detail-row"><span class="label">伝票番号</span><span class="value">${escapeHtml(o.tracking)}</span></div>` : ''}
    </div>

    ${isShipped ? `
      <div class="card" style="text-align:center;color:var(--green);font-weight:600">
        ✓ 発送済み — LINE通知済み
      </div>
    ` : `
      <div class="detail-card">
        <div style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px">伝票番号を入力</div>
        <input type="text" class="tracking-input" id="trackingInput" placeholder="0000-0000-0000" inputmode="numeric" autocomplete="off">
        <button class="btn-primary" id="shipBtn" onclick="confirmShip()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          発送完了 → LINE通知
        </button>
      </div>
    `}
  `;
}

async function confirmShip() {
  const tracking = document.getElementById('trackingInput').value.trim();
  if (!tracking) { toast('伝票番号を入力してください', 'error'); return; }

  const btn = document.getElementById('shipBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = '送信中...';

  // Demo mode
  if (isDemoMode()) {
    setTimeout(() => {
      toast('🎭 デモ: LINE通知は送信されません', 'success');
      selectedOrder.shipStatus = '発送済';
      selectedOrder.tracking = tracking;
      renderShipDetail();
      const idx = ordersCache.findIndex(o => o.id === selectedOrder.id);
      if (idx >= 0) ordersCache[idx] = selectedOrder;
    }, 600);
    return;
  }

  try {
    const res = await fetch(GAS_URL + '?action=staff_ship', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ orderId: selectedOrder.id, tracking })
    });
    const data = await res.json();
    if (data.success) {
      toast('発送完了 — LINE通知しました', 'success');
      selectedOrder.shipStatus = '発送済';
      selectedOrder.tracking = tracking;
      renderShipDetail();
      // Update orders cache
      const idx = ordersCache.findIndex(o => o.id === selectedOrder.id);
      if (idx >= 0) ordersCache[idx] = selectedOrder;
    } else {
      throw new Error(data.error || '発送処理失敗');
    }
  } catch (e) {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> 発送完了 → LINE通知';
    toast('エラー: ' + e.message, 'error');
  }
}

/* ================ CSV ================ */
function downloadCSV() {
  if (!GAS_URL) { toast('GAS URLが未設定', 'error'); return; }
  window.open(GAS_URL + '?action=b2_csv', '_blank');
}

/* ================ HELPERS ================ */
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================ INIT ================ */
if (localStorage.getItem(SESSION_KEY) === '1') {
  enterApp();
}
renderPin();
</script>
