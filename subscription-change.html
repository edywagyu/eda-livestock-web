<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="public/images/favicon.svg">
<link rel="apple-touch-icon" href="public/images/favicon.svg">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>定期便のプラン変更｜江田畜産</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0F3D2E; --forest-2:#0B2E23; --gold:#D4A93B; --gold-text:#E7C572;
  --cream:#FAF7F0; --line:rgba(250,247,240,0.14); --muted:rgba(250,247,240,0.62);
}
*{box-sizing:border-box}
body{margin:0;background:var(--forest-2);color:var(--cream);
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.7}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.topbar img{height:34px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--cream)}
h1{font-family:'Shippori Mincho',serif;font-size:23px;font-weight:600;margin:26px 0 6px}
.lead{font-size:14px;color:var(--muted);margin:0 0 24px}
.current{background:rgba(255,255,255,0.05);border:1px solid rgba(212,169,59,0.35);border-radius:12px;padding:14px 18px;margin-bottom:26px}
.current .label{font-size:12px;color:var(--muted)}
.current .val{font-size:17px;color:var(--gold-text)}
.plans{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.plan:hover{border-color:rgba(212,169,59,0.6)}
.plan.sel{border-color:var(--gold);background:rgba(212,169,59,0.10)}
.plan.now{opacity:.55;cursor:default}
.plan .nm{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:2px}
.plan .sp{font-size:12px;color:var(--muted)}
.plan .pr{font-size:20px;color:var(--gold-text);margin:10px 0 8px}
.plan .pr small{font-size:12px;color:var(--muted)}
.plan .it{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
.badge{display:inline-block;font-size:11px;color:#0B2E23;background:var(--gold);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.badge.now{background:rgba(250,247,240,0.2);color:var(--cream)}
label.note{display:block;font-size:13px;color:var(--muted);margin:26px 0 8px}
textarea{width:100%;min-height:88px;background:rgba(255,255,255,0.05);border:1px solid var(--line);
  border-radius:10px;color:var(--cream);padding:12px 14px;font:inherit;font-size:14px}
textarea:focus{outline:none;border-color:var(--gold)}
.submit{margin-top:20px;width:100%;background:var(--gold);color:#0B2E23;border:none;border-radius:10px;
  padding:15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.submit:disabled{opacity:.4;cursor:not-allowed}
.err{color:#F1A9A9;font-size:13px;margin-top:10px;min-height:18px}
.done{background:rgba(212,169,59,0.10);border:1px solid rgba(212,169,59,0.5);border-radius:12px;padding:26px;text-align:center}
.done h2{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600;margin:0 0 10px}
.done p{font-size:14px;color:var(--muted);margin:0 0 18px}
.done a{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:11px 22px;font-size:14px;text-decoration:none}
.fine{font-size:12px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>

<div class="topbar">
  <a href="mypage.html"><img src="public/images/logo/eda-livestock-logo.png" alt="EDA-LIVESTOCK"></a>
  <a class="back" href="mypage.html">&larr; マイページに戻る</a>
</div>

<div class="wrap">
  <h1>定期便のプラン変更</h1>
  <p class="lead">ご希望のプランをお選びください。次回のお届け分から切り替えます。</p>

  <div id="current" class="current" style="display:none">
    <div class="label">現在のプラン</div>
    <div class="val" id="currentVal">—</div>
  </div>

  <div id="form">
    <div class="plans" id="plans"></div>

    <label class="note" for="note">ご要望（任意）</label>
    <textarea id="note" placeholder="例：牛肉を多めにしてほしい／次回から変更したい"></textarea>

    <button class="submit" id="submit" disabled>この内容で変更を申し込む</button>
    <div class="err" id="err"></div>
    <p class="fine">お申し込み後、担当者が内容を確認してから切り替えます。切り替え完了はご連絡いたします。この画面だけでは請求内容は変わりません。</p>
  </div>

  <div id="done" class="done" style="display:none">
    <h2>お申し込みを受け付けました</h2>
    <p>担当者が確認のうえ、次回のお届け分から切り替えてご連絡いたします。</p>
    <a href="mypage.html">マイページに戻る</a>
  </div>
</div>

<script src="public/js/eda-bundle.js?v=006" defer></script>
<script>
var SESSION_KEY = 'eda-mypage-session';
var _email = '', _currentPlan = '', _selected = null, _plans = [];

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
}
function yen(n) { return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showErr(msg) { document.getElementById('err').textContent = msg || ''; }

function renderPlans() {
  var box = document.getElementById('plans');
  box.innerHTML = _plans.map(function (p, i) {
    var isNow = _currentPlan && _currentPlan.indexOf(p.name) >= 0;
    var badge = isNow ? '<span class="badge now">ご利用中</span>'
              : (String(p.badgeLabel || '').indexOf('人気') >= 0 ? '<span class="badge">人気 No.1</span>' : '');
    return '<button type="button" class="plan' + (isNow ? ' now' : '') + '" data-i="' + i + '"' +
      (isNow ? ' disabled' : '') + '>' + badge +
      '<div class="nm">' + esc(p.name) + 'プラン</div>' +
      '<div class="sp">' + esc(p.spec) + '／' + esc(p.target) + '</div>' +
      '<div class="pr">' + yen(p.oldPrice) + '<small>/月</small></div>' +
      '<div class="it">' + esc(p.items) + '</div>' +
      '</button>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.plan'), function (el) {
    if (el.disabled) return;
    el.addEventListener('click', function () {
      Array.prototype.forEach.call(box.querySelectorAll('.plan'), function (x) { x.classList.remove('sel'); });
      el.classList.add('sel');
      _selected = _plans[Number(el.getAttribute('data-i'))];
      document.getElementById('submit').disabled = false;
      showErr('');
    });
  });
}

async function boot() {
  var s = getSession();
  if (!s || !s.email) { location.href = 'mypage.html'; return; }
  _email = s.email;

  try {
    var sub = await window.EDA_API.get('customer_lookup', { email: _email });
    var sc = (sub && sub.customer && sub.customer.subscription) || null;
    if (sc && sc.active) {
      _currentPlan = sc.plan_name || '';
      document.getElementById('current').style.display = '';
      document.getElementById('currentVal').textContent =
        (sc.plan_name || '定期便') + '　' + yen(sc.price) + '/月' +
        (sc.next_delivery ? '　次回 ' + sc.next_delivery : '');
    }
  } catch (e) {}

  try {
    var res = await window.EDA_API.get('public_subscriptions', {});
    _plans = ((res && res.plans) || []).filter(function (p) { return String(p.published) !== 'FALSE'; });
  } catch (e) { _plans = []; }
  if (!_plans.length) { showErr('プランを読み込めませんでした。時間をおいて開き直してください。'); return; }
  renderPlans();
}

document.getElementById('submit').addEventListener('click', async function () {
  if (!_selected) { showErr('変更したいプランを選んでください'); return; }
  var btn = this;
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    var r = await window.EDA_API.post('change_subscription_plan', {
      email: _email,
      current_plan: _currentPlan,
      new_plan: _selected.name + 'プラン（' + yen(_selected.oldPrice) + '/月）',
      note: document.getElementById('note').value || ''
    });
    if (r && r.ok) {
      document.getElementById('form').style.display = 'none';
      document.getElementById('done').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showErr('送信できませんでした：' + ((r && r.error) || '時間をおいてお試しください'));
      btn.disabled = false; btn.textContent = 'この内容で変更を申し込む';
    }
  } catch (e) {
    showErr('通信エラーが発生しました');
    btn.disabled = false; btn.textContent = 'この内容で変更を申し込む';
  }
});

function startWhenReady() {
  var tries = 0;
  (function waitApi() {
    if (window.EDA_API && window.EDA_API.get) { boot(); return; }
    if (++tries > 60) { showErr('接続の準備ができませんでした。開き直してください。'); return; }
    setTimeout(waitApi, 100);
  })();
}
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', startWhenReady);
else startWhenReady();
</script>
</body>
</html>
