<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商談予約 / Book a Meeting — EDA Livestock</title>
<meta name="description" content="江田畜産・江田友輝とのオンライン商談予約。Google Calendar 直結。">
<meta http-equiv="refresh" content="2; url=https://calendar.app.google/DjKHsVDhJHesaPM27">
<link rel="canonical" href="https://calendar.app.google/DjKHsVDhJHesaPM27">
<link rel="icon" type="image/svg+xml" href="public/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #0F3D2E;
    --forest-deep: #0A2D21;
    --gold: #D4A93B;
    --gold-soft: #FFE594;
    --cream: #FAF7F0;
    --ink: #1A1A1A;
    --ink-muted: rgba(26,26,26,0.62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, #F5EFE3 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: white;
    border-radius: 18px;
    padding: 48px 36px;
    box-shadow: 0 16px 48px rgba(15,61,46,0.14), 0 4px 12px rgba(0,0,0,0.06);
    text-align: center;
    border: 1px solid rgba(212,169,59,0.18);
  }
  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 6vw, 40px);
    margin: 16px 0 12px;
    color: var(--forest-deep);
    font-weight: 500;
    line-height: 1.2;
  }
  .accent { color: var(--gold); }
  p {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink-muted);
    margin: 0 0 24px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(15,61,46,0.12);
    border-top-color: var(--forest);
    border-radius: 50%;
    margin: 24px auto;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    background: var(--forest);
    color: white;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    transition: background 0.25s, transform 0.25s;
  }
  .cta:hover { background: var(--forest-deep); transform: translateY(-2px); }
  .cta-arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold); color: var(--forest-deep);
    font-weight: 800; font-size: 11px;
  }
  .fine {
    font-size: 11px;
    color: rgba(26,26,26,0.4);
    margin-top: 24px;
    letter-spacing: 0.04em;
  }
  .back {
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .back a { color: var(--forest); text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">— Schedule a Meeting —</span>
    <h1>Book an<br/><span class="accent">Appointment.</span></h1>
    <p>Google Calendar の予約ページへ移動します<br/>Redirecting to Google Appointment Scheduler…</p>
    <div class="spinner" aria-hidden="true"></div>
    <a class="cta" href="https://calendar.app.google/DjKHsVDhJHesaPM27" rel="noopener">
      今すぐ開く / Open Now
      <span class="cta-arrow" aria-hidden="true">→</span>
    </a>
    <p class="fine">日本時間 6:00 – 24:00 / 1時間スロット / 3日後以降</p>
    <p class="back"><a href="index.html">← トップに戻る</a></p>
  </div>
  <script>
    // 自動リダイレクト (meta refresh のバックアップ)
    setTimeout(function() {
      window.location.replace('https://calendar.app.google/DjKHsVDhJHesaPM27');
    }, 2000);
  </script>
</body>
</html>
