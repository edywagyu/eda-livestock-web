<!-- ========= CART DRAWER ========= -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-head">
    <h3>CART</h3>
    <button class="cart-close" id="cartClose">&times;</button>
  </div>
  <div class="cart-drawer-items" id="cartItems">
    <div class="cart-empty" id="cartEmpty">
      <div class="cart-empty-icon">🛒</div>
      カートは空です
    </div>
  </div>
  <div class="cart-drawer-foot" id="cartFoot" style="display:none;">
    <div class="cart-subtotal">
      <span class="cart-subtotal-label">SUBTOTAL</span>
      <span class="cart-subtotal-price" id="cartSubtotal">¥0</span>
    </div>
    <div class="cart-shipping-note">
      ¥11,000以上で<strong>送料無料</strong>。冷凍便でお届け。
    </div>
    <div class="cart-delivery-note" id="cartDelivery"></div>
    <button class="btn-checkout" id="cartCheckout">レジに進む — Checkout</button>
    <button class="cart-continue" id="cartContinue">買い物を続ける</button>
  </div>
</aside>

<!-- ========= STICKY CART BAR (MOBILE) ========= -->
<div class="sticky-cart-bar" id="stickyCartBar">
  <div class="sticky-cart-info">
    <span class="sticky-cart-count" id="stickyCartCount">0 items</span>
    <span class="sticky-cart-total" id="stickyCartTotal">¥0</span>
  </div>
  <button class="sticky-cart-btn" id="stickyCartBtn">カートを見る</button>
</div>
