<script>
  /* ---- Header scroll shrink ---- */
  const header = document.getElementById('siteHeader');
  if (header) {
    window.addEventListener('scroll', () => {
      if (window.scrollY > 80) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    }, { passive: true });
  }

  /* ---- Reveal on scroll (IntersectionObserver) ---- */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* ---- Counter number animation ---- */
  function animateCounter(el) {
    const text = el.textContent.trim();
    const match = text.match(/^([0-9.,]+)/);
    if (!match) return;
    const targetStr = match[1].replace(/,/g, '');
    const target = parseFloat(targetStr);
    if (isNaN(target)) return;
    const suffix = text.slice(match[0].length);
    const hasDecimal = targetStr.includes('.');
    const decimals = hasDecimal ? targetStr.split('.')[1].length : 0;
    const duration = 1800;
    const start = performance.now();

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function tick(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);
      const current = eased * target;

      if (hasDecimal) {
        el.firstChild.textContent = current.toFixed(decimals);
      } else {
        el.firstChild.textContent = Math.round(current).toLocaleString();
      }

      if (progress < 1) requestAnimationFrame(tick);
      else el.firstChild.textContent = match[0];
    }

    /* Set to 0 initially, then animate */
    const firstText = el.firstChild;
    if (firstText && firstText.nodeType === 3) {
      firstText.textContent = hasDecimal ? (0).toFixed(decimals) : '0';
    }
    requestAnimationFrame(tick);
  }

  const counterIO = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        animateCounter(e.target);
        counterIO.unobserve(e.target);
      }
    });
  }, { threshold: 0.3 });

  document.querySelectorAll('.counter-num, .stat-pie-num, .hero-stat-num, .global-stat-num').forEach(el => {
    counterIO.observe(el);
  });

  /* ---- Smooth scroll for anchor links ---- */
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', (e) => {
      const target = document.querySelector(a.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  /* ---- Tab toggle ---- */
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      const group = t.closest('.tab-row');
      if (!group) return;
      group.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
    });
  });

  /* ---- Language toggle ---- */
  document.querySelectorAll('.lang-toggle span').forEach(s => {
    s.addEventListener('click', () => {
      document.querySelectorAll('.lang-toggle span').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
    });
  });

  /* ======== DELIVERY DATE CALCULATOR ======== */
  function getDeliveryDate() {
    const DAYS_JP = ['日','月','火','水','木','金','土'];
    const now = new Date();
    /* JST offset */
    const jst = new Date(now.getTime() + (9 * 60 - now.getTimezoneOffset()) * 60000);
    const hour = jst.getHours();
    /* Before 14:00 JST → +2 days, after → +3 days */
    let addDays = hour < 14 ? 2 : 3;
    const delivery = new Date(jst);
    delivery.setDate(delivery.getDate() + addDays);
    /* Skip Sunday */
    if (delivery.getDay() === 0) delivery.setDate(delivery.getDate() + 1);
    const m = delivery.getMonth() + 1;
    const d = delivery.getDate();
    const day = DAYS_JP[delivery.getDay()];
    return { text: m + '月' + d + '日（' + day + '）', isToday14: hour < 14 };
  }

  /* Populate delivery estimates on product cards */
  (function() {
    const info = getDeliveryDate();
    const label = info.isToday14
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;"><path d="M1 16V6h11v10H1zM12 8h4l3 4v4h-5"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>' + info.text + 'にお届け'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px;"><path d="M1 16V6h11v10H1zM12 8h4l3 4v4h-5"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>最短 ' + info.text + 'にお届け';
    document.querySelectorAll('.product-card[data-variants]').forEach(function(card) {
      var existing = card.querySelector('.delivery-estimate');
      if (existing) return;
      var el = document.createElement('p');
      el.className = 'delivery-estimate';
      el.innerHTML = label;
      var buy = card.querySelector('.product-buy');
      if (buy) card.insertBefore(el, buy);
    });
  })();

  /* ======== URGENCY: VIEWER COUNT ======== */
  (function() {
    var el = document.querySelector('.shop-proof-viewers');
    if (!el) return;
    /* Deterministic pseudo-random from date seed */
    var seed = new Date().toISOString().slice(0,10).split('').reduce(function(a,c){ return a + c.charCodeAt(0); }, 0);
    var count = 18 + (seed % 30);
    el.textContent = count + '人が今日このページを閲覧中';
  })();

  /* ======== CART SYSTEM ======== */
  (function() {
    // GAS URL は public/js/eda-config.js で集中管理 (デプロイ時1ヶ所のみ変更)
    const GAS_API_URL = (window.EDA_CONFIG && window.EDA_CONFIG.GAS_URL) || '';
    const CART_KEY = 'eda-cart';
    const FREE_SHIP = 11000;

    /* --- State --- */
    let items = JSON.parse(localStorage.getItem(CART_KEY) || '[]');

    /* --- DOM refs --- */
    const drawer    = document.getElementById('cartDrawer');
    const overlay   = document.getElementById('cartOverlay');
    const itemsEl   = document.getElementById('cartItems');
    const emptyEl   = document.getElementById('cartEmpty');
    const footEl    = document.getElementById('cartFoot');
    const subtotalEl= document.getElementById('cartSubtotal');
    const badge     = document.getElementById('cartBadge');
    const toggleBtn = document.getElementById('cartToggle');
    const closeBtn  = document.getElementById('cartClose');
    const checkBtn  = document.getElementById('cartCheckout');
    const contBtn   = document.getElementById('cartContinue');

    if (!drawer) return; /* cart partial not on page */

    /* --- Open / Close --- */
    function openCart()  { drawer.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeCart() { drawer.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }

    if (toggleBtn) toggleBtn.addEventListener('click', openCart);
    if (closeBtn)  closeBtn.addEventListener('click', closeCart);
    if (overlay)   overlay.addEventListener('click', closeCart);
    if (contBtn)   contBtn.addEventListener('click', closeCart);

    /* --- 配送日プルダウン生成（最短〜14日後） --- */
    (function populateDeliveryDates() {
      const sel = document.getElementById('deliveryDate');
      if (!sel) return;
      const days = ['日','月','火','水','木','金','土'];
      const now = new Date();
      const cutoffHour = 13;
      // 最短発送日（13時前なら今日、それ以降は翌営業日）
      let firstShip = new Date(now);
      const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;
      if (now.getHours() >= cutoffHour || isWeekend(firstShip)) {
        do {
          firstShip.setDate(firstShip.getDate() + 1);
        } while (isWeekend(firstShip));
      }
      // 最短お届け = 発送翌日
      const earliest = new Date(firstShip);
      earliest.setDate(earliest.getDate() + 1);

      // 14日先までを選択肢に
      for (let i = 0; i < 14; i++) {
        const d = new Date(earliest);
        d.setDate(earliest.getDate() + i);
        const m = d.getMonth() + 1;
        const day = d.getDate();
        const w = days[d.getDay()];
        const val = d.toISOString().slice(0, 10);
        const label = i === 0
          ? `${m}月${day}日（${w}）— 最短`
          : `${m}月${day}日（${w}）`;
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = label;
        sel.appendChild(opt);
      }
    })();

    /* 配送指定の表示更新（cartCheckoutに値を反映するために使用） */
    window.updateDeliveryNote = function() {
      const dateEl = document.getElementById('deliveryDate');
      const timeEl = document.getElementById('deliveryTime');
      const note = document.getElementById('deliveryPickerNote');
      if (!note) return;
      const dt = dateEl ? dateEl.value : '';
      const tm = timeEl ? timeEl.options[timeEl.selectedIndex]?.text : '';
      if (dt) {
        const d = new Date(dt);
        const m = d.getMonth() + 1;
        const day = d.getDate();
        note.innerHTML = `<strong>${m}月${day}日</strong> ${tm && tm !== '指定なし' ? '・' + tm : ''} にお届け予定`;
      } else {
        note.textContent = '指定なしの場合、最短日でお届けします';
      }
    };

    /* --- Save --- */
    function save() { localStorage.setItem(CART_KEY, JSON.stringify(items)); }

    /* --- Render badge --- */
    function renderBadge() {
      const count = items.reduce((s, i) => s + i.qty, 0);
      if (badge) {
        badge.textContent = count;
        badge.classList.toggle('show', count > 0);
      }
    }

    /* --- Render drawer --- */
    function renderCart() {
      renderBadge();
      if (!itemsEl) return;

      if (items.length === 0) {
        if (emptyEl) emptyEl.style.display = '';
        if (footEl) footEl.style.display = 'none';
        /* clear item elements only */
        itemsEl.querySelectorAll('.cart-item').forEach(el => el.remove());
        return;
      }

      if (emptyEl) emptyEl.style.display = 'none';
      if (footEl) footEl.style.display = '';

      let html = '';
      let subtotal = 0;
      items.forEach((item, idx) => {
        subtotal += item.price * item.qty;
        html += `<div class="cart-item" data-idx="${idx}">
          <div class="cart-item-img"><img src="${item.img}" alt=""/></div>
          <div class="cart-item-info">
            <div class="cart-item-title">${item.title}</div>
            <div class="cart-item-variant">${item.variant}</div>
            <div class="cart-item-bottom">
              <span class="cart-item-price">¥${(item.price * item.qty).toLocaleString()}</span>
              <div class="cart-item-qty">
                <button data-action="minus" data-idx="${idx}">−</button>
                <span>${item.qty}</span>
                <button data-action="plus" data-idx="${idx}">+</button>
                <button class="cart-item-remove" data-action="remove" data-idx="${idx}">✕</button>
              </div>
            </div>
          </div>
        </div>`;
      });

      /* keep empty div, replace item HTML */
      itemsEl.querySelectorAll('.cart-item').forEach(el => el.remove());
      itemsEl.insertAdjacentHTML('beforeend', html);

      if (subtotalEl) subtotalEl.textContent = '¥' + subtotal.toLocaleString();

      /* shipping note */
      const noteEl = document.querySelector('.cart-shipping-note');
      if (noteEl) {
        const remaining = FREE_SHIP - subtotal;
        if (remaining > 0) {
          noteEl.innerHTML = `あと<strong>¥${remaining.toLocaleString()}</strong>で送料無料`;
        } else {
          noteEl.innerHTML = '<strong>送料無料</strong>でお届けします！';
        }
      }

      if (checkBtn) checkBtn.disabled = items.length === 0;

      /* delivery date in cart */
      const delivEl = document.getElementById('cartDelivery');
      if (delivEl && items.length > 0) {
        const dInfo = getDeliveryDate();
        delivEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px;"><path d="M1 16V6h11v10H1zM12 8h4l3 4v4h-5"/><circle cx="5.5" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>最短 <strong>' + dInfo.text + '</strong> にお届け';
      }

      /* sticky cart bar */
      const stickyBar = document.getElementById('stickyCartBar');
      const stickyCount = document.getElementById('stickyCartCount');
      const stickyTotal = document.getElementById('stickyCartTotal');
      if (stickyBar) {
        const totalQty = items.reduce((s, i) => s + i.qty, 0);
        if (totalQty > 0) {
          stickyCount.textContent = totalQty + '点';
          stickyTotal.textContent = '¥' + subtotal.toLocaleString();
          stickyBar.classList.add('visible');
        } else {
          stickyBar.classList.remove('visible');
        }
      }
    }

    /* --- Cart item actions (event delegation) --- */
    if (itemsEl) {
      itemsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const idx = parseInt(btn.dataset.idx);
        const action = btn.dataset.action;

        if (action === 'plus')  { items[idx].qty++; }
        if (action === 'minus') { items[idx].qty--; if (items[idx].qty < 1) items.splice(idx, 1); }
        if (action === 'remove') { items.splice(idx, 1); }

        save();
        renderCart();
      });
    }

    /* --- Checkout → Stripe via GAS API --- */
    if (checkBtn) {
      checkBtn.addEventListener('click', async () => {
        if (items.length === 0) return;

        /* ボタンをローディング状態に */
        checkBtn.disabled = true;
        const originalText = checkBtn.textContent;
        checkBtn.textContent = '決済ページへ移動中...';

        try {
          const dateEl = document.getElementById('deliveryDate');
          const timeEl = document.getElementById('deliveryTime');
          const res = await fetch(GAS_API_URL + '?action=create_checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              items: items.map(i => ({
                title: i.title,
                variant: i.variant,
                price: i.price,
                qty: i.qty,
                variantId: i.variantId
              })),
              deliveryDate: dateEl ? dateEl.value : '',
              deliveryTime: timeEl ? timeEl.value : ''
            })
          });

          const result = await res.json();

          if (result.url) {
            window.location.href = result.url;
          } else {
            throw new Error(result.error || '決済セッションの作成に失敗しました');
          }
        } catch (err) {
          alert('決済エラー: ' + err.message + '\nもう一度お試しください。');
          checkBtn.disabled = false;
          checkBtn.textContent = originalText;
        }
      });
    }

    /* --- Add to cart from product card --- */
    function addToCart(variantId, price, title, variant, img) {
      const existing = items.find(i => i.variantId === variantId);
      if (existing) {
        existing.qty++;
      } else {
        items.push({ variantId, price, title, variant, img, qty: 1 });
      }
      save();
      renderCart();
      openCart();
    }

    /* --- Initialize product cards --- */
    document.querySelectorAll('.product-card[data-variants]').forEach(card => {
      const buyEl = card.querySelector('.product-buy');
      if (!buyEl) return;

      let variants;
      try { variants = JSON.parse(card.dataset.variants); } catch(e) { return; }
      if (!variants.length) return;

      const title = (card.querySelector('.product-name') || {}).textContent || '';
      const imgEl = card.querySelector('.product-card-img img');
      const img = imgEl ? imgEl.src : '';

      let html = '';
      if (variants.length > 1) {
        html += '<select class="variant-select">';
        variants.forEach((v, i) => {
          html += `<option value="${i}">${v.t} — ¥${v.p.toLocaleString()}</option>`;
        });
        html += '</select>';
      }
      html += '<button class="btn-add-cart">カートに追加</button>';
      buyEl.innerHTML = html;

      const addBtn = buyEl.querySelector('.btn-add-cart');
      const select = buyEl.querySelector('.variant-select');

      addBtn.addEventListener('click', () => {
        const idx = select ? parseInt(select.value) : 0;
        const v = variants[idx];
        addToCart(v.id, v.p, title, v.t, img);

        /* visual feedback */
        addBtn.classList.add('added');
        addBtn.textContent = '追加しました ✓';
        setTimeout(() => {
          addBtn.classList.remove('added');
          addBtn.textContent = 'カートに追加';
        }, 1200);
      });
    });

    /* --- Tab filter for shop page --- */
    document.querySelectorAll('.tab[data-filter]').forEach(tab => {
      tab.addEventListener('click', () => {
        const filter = tab.dataset.filter;
        document.querySelectorAll('.tab[data-filter]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.querySelectorAll('[data-cat]').forEach(el => {
          if (filter === 'all') { el.style.display = ''; }
          else { el.style.display = el.dataset.cat === filter ? '' : 'none'; }
        });
      });
    });

    /* --- Sticky cart bar button --- */
    const stickyBtn = document.getElementById('stickyCartBtn');
    if (stickyBtn) stickyBtn.addEventListener('click', openCart);

    /* --- Initial render --- */
    renderCart();

    /* --- Expose for other pages --- */
    window.edaCart = { addToCart, openCart, renderCart };
  })();
</script>
