<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDA WAGYU — Live Shipment Tracking</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shippori+Mincho:wght@500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --green:#0F3D2E; --green-soft:#1d6e56; --gold:#D4A93B; --gold-deep:#854F0B;
    --cream:#FAF7F0; --ink:#23241f; --muted:#7c8079; --line:rgba(15,61,46,.13); --line2:rgba(15,61,46,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream); color:var(--ink); font-family:Inter,system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px; margin:26px auto; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  /* header */
  .hd{background:var(--green); color:var(--cream); padding:16px 26px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-family:"Shippori Mincho",serif; font-weight:600; font-size:20px; letter-spacing:3px;}
  .hd .right{text-align:right;}
  .hd .ord{color:var(--gold); font-size:13px; letter-spacing:.5px;}
  .hd .sub{font-size:11px; opacity:.75; margin-top:2px;}
  /* demo banner */
  .demo{background:#FBF1D8; color:var(--gold-deep); font-size:13px; padding:10px 26px; display:flex; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(133,79,11,.18);}
  .demo a{color:var(--gold-deep); font-weight:600; white-space:nowrap;}
  /* status hero */
  .hero{padding:20px 26px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .hero .ic{width:40px;height:40px;color:var(--green); flex-shrink:0;}
  .hero h1{margin:0; font-size:23px; font-weight:600;}
  .hero .desc{color:var(--muted); font-size:14px; margin-top:2px;}
  .hero .spacer{flex:1;}
  .live{display:inline-flex; align-items:center; gap:6px; background:var(--gold); color:var(--green); font-size:12px; font-weight:600; padding:4px 11px; border-radius:20px; letter-spacing:.5px;}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:p 1.4s infinite;}
  @keyframes p{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
  .etabox{background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px; text-align:right;}
  .etabox .k{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  .etabox .v{font-size:15px; font-weight:600;}
  /* current location bar */
  .locbar{display:flex; align-items:center; gap:13px; margin:0 26px 4px; padding:13px 16px; background:#FBF3E2; border:1px solid var(--gold); border-radius:12px;}
  .locbar .lic{color:var(--gold-deep); flex-shrink:0; display:flex;}
  .locbar .lic svg{width:24px;height:24px;}
  .locbar .lk{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--gold-deep); font-weight:600;}
  .locbar .lv{font-size:16px; font-weight:600; color:var(--ink); line-height:1.3;}
  /* main grid */
  .main{display:grid; grid-template-columns: 1.5fr 1fr; gap:22px; padding:18px 26px;}
  #map{height:430px; border-radius:12px; background:#e9e6df; border:1px solid var(--line);}
  .leaflet-container{font-family:Inter,sans-serif; border-radius:12px;}
  .plane-i{transition:transform .6s linear;}
  .leaflet-tooltip.ap-tip,.leaflet-tooltip.leg-tip{font-family:Inter; font-weight:600; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .leaflet-tooltip.ap-tip{background:#fff; color:var(--green); border:1px solid var(--green); border-radius:8px; font-size:11px; padding:2px 7px;}
  .leaflet-tooltip.leg-tip{background:var(--green); color:#fff; border:none; border-radius:10px; font-size:11px; padding:3px 9px;}
  .leaflet-tooltip.ap-tip:before,.leaflet-tooltip.leg-tip:before{display:none;}
  .mapnote{font-size:11.5px; color:var(--muted); margin-top:8px; text-align:center;}
  /* details card */
  .card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; align-self:start;}
  .card h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:600;}
  .fld{display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line2); font-size:13.5px;}
  .fld .k{color:var(--muted); flex-shrink:0;}
  .fld .v{text-align:right; font-weight:500;}
  .awb{font-family:"Roboto Mono",monospace; font-size:16px; font-weight:500; color:var(--green); display:inline-flex; align-items:center; gap:8px;}
  .cpy{border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 6px; cursor:pointer; color:var(--muted); font-size:11px; display:inline-flex; align-items:center; gap:3px;}
  .cpy:hover{border-color:var(--green); color:var(--green);}
  .carrier{display:inline-flex; align-items:center; gap:7px; font-weight:600; color:var(--green);}
  .carrier svg{width:17px;height:17px;}
  /* flight legs */
  .legs{margin:6px 0 4px;}
  .leg{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px; background:var(--cream);}
  .leg.act{border-color:var(--gold); background:#FBF3E2;}
  .leg .top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .leg .fn{font-weight:600; font-size:14px; color:var(--green); display:inline-flex; align-items:center; gap:6px;}
  .leg.act .fn{color:var(--gold-deep);}
  .leg .trk{font-size:11.5px; font-weight:600; color:#185FA5; white-space:nowrap;}
  .leg .rt{font-size:13px; margin-top:5px;}
  .leg .tm{font-size:11.5px; color:var(--muted); margin-top:2px;}
  /* timeline */
  .tlsec{padding:6px 26px 0;}
  .tlsec h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:600; margin:0 0 14px;}
  .tl{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(5,auto); gap:0 36px;}
  .tl li{position:relative; padding:0 0 16px 30px;}
  .tl li:before{content:""; position:absolute; left:9px; top:19px; bottom:1px; width:2px; background:var(--line);}
  .tl li.col-end:before, .tl li:last-child:before{display:none;}
  .dot{position:absolute; left:0; top:1px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:2px solid var(--line);}
  .dot svg{width:12px;height:12px;}
  .done .dot{background:var(--green); border-color:var(--green); color:#fff;}
  .active .dot{background:var(--gold); border-color:var(--gold); color:var(--green);}
  .tl .lab{font-size:14px; font-weight:500;}
  .tl .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .pending .lab{color:var(--muted); font-weight:400;}
  .active .lab{color:var(--gold-deep); font-weight:600;}
  .est{font-size:10px; color:var(--gold-deep); background:#FBF1D8; border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:1px;}
  /* provenance */
  .prov{margin:18px 26px 0; background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:13px 16px; display:flex; flex-wrap:wrap; gap:9px 22px;}
  .prov span{font-size:12.5px; color:#46504a; display:inline-flex; align-items:center; gap:7px;}
  .prov svg{width:16px;height:16px;color:var(--green);}
  /* footer */
  .ft{background:var(--green); color:var(--cream); text-align:center; padding:15px 26px; margin-top:20px;}
  .ft .awbf{color:var(--gold); font-size:12px; letter-spacing:.5px;}
  .ft .tag{font-size:12px; margin-top:3px; opacity:.85;}
  @media(max-width:760px){
    .wrap{margin:0; border-radius:0; border:none;}
    .main{grid-template-columns:1fr; gap:18px; padding:18px;}
    #map{height:300px;}
    .tl{grid-template-columns:1fr; grid-auto-flow:row; grid-template-rows:none;}
    .tl li.col-end:before{display:block;}
    .hero{padding:16px 18px;}
    .hd,.demo,.tlsec,.prov,.ft{padding-left:18px; padding-right:18px;}
    .prov{margin:16px 18px 0;}
    .locbar{margin-left:18px; margin-right:18px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="brand">EDA WAGYU</div>
    <div class="right">
      <div class="ord" id="ord">order —</div>
      <div class="sub" id="ordsub"></div>
    </div>
  </header>

  <div class="demo" id="demo" style="display:none">
    <span id="demoTxt"></span>
    <a href="?live=1" id="liveLink">View live time ▸</a>
  </div>

  <section class="hero">
    <span class="ic" id="heroIcon"></span>
    <div>
      <h1 id="status">Loading…</h1>
      <div class="desc" id="statusSub"></div>
    </div>
    <span class="spacer"></span>
    <span class="live" id="liveBadge" style="display:none"><span class="pulse"></span>LIVE</span>
    <div class="etabox" id="etaBox" style="display:none"></div>
  </section>

  <div class="locbar" id="locbar" style="display:none">
    <span class="lic" id="locIcon"></span>
    <div><span class="lk">Current location</span><span class="lv" id="locText"></span></div>
  </div>

  <div class="main">
    <div>
      <div id="map"></div>
      <div class="mapnote" id="mapNote"></div>
    </div>
    <div class="card" id="detail"></div>
  </div>

  <section class="tlsec">
    <h3>Shipment progress</h3>
    <ul class="tl" id="tl"></ul>
  </section>

  <div class="prov" id="prov"></div>

  <footer class="ft">
    <div class="awbf" id="awbf">AWB —</div>
    <div class="tag">live tracking by EDA WAGYU</div>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ============================================================
   EDA WAGYU — live shipment tracking (MVP, desktop / B2B)
   Data source: OCS booking email (AWB + carrier + flight no. + routing + schedule).
   Plane position = great-circle estimate from the flight schedule.
   PHASE 2: replace estimatePosition() with a live ADS-B feed
            (backend ?action=flightpos&flt=... ) for true real-time dot.
   ============================================================ */

var AIRPORTS = {
  NRT:{name:"Tokyo Narita", city:"Tokyo", ll:[35.7720,140.3929]},
  DXB:{name:"Dubai",        city:"Dubai", ll:[25.2532, 55.3657]},
  MAD:{name:"Madrid",       city:"Madrid",ll:[40.4936, -3.5668]}
};

var SHIPMENTS = {
  "carnes-0626":{
    order:"EDA-20260626", buyer:"CARNES · Madrid, Spain",
    awb:"176-27983023", airline:"Emirates SkyCargo",
    exporter:"Eda Livestock Co., Ltd. · Japan",
    importer:"Carnes Rojas Premium S.L. · Madrid, Spain",
    product:"Eda Wagyu A5 (chilled)", boxes:34, temp:"0–4°C",
    etd:"Narita · 30 Jun", eta:"Madrid · 1 Jul, 20:20",
    route:["NRT","DXB","MAD"],
    legs:[
      {flight:"EK319", carrier:"Emirates", from:"NRT", to:"DXB",
       dep:"2026-06-30T13:30:00Z", arr:"2026-07-01T00:05:00Z",
       depDisp:"30 Jun 22:30 (JST)", arrDisp:"1 Jul 04:05 (GST)",
       track:"https://www.flightradar24.com/data/flights/ek319"},
      {flight:"EK143", carrier:"Emirates", from:"DXB", to:"MAD",
       dep:"2026-07-01T10:20:00Z", arr:"2026-07-01T18:20:00Z",
       depDisp:"1 Jul 14:20 (GST)", arrDisp:"1 Jul 20:20 (CEST)",
       track:"https://www.flightradar24.com/data/flights/ek143"}
    ],
    steps:[
      {key:"slaughter", lab:"Slaughtered & A5 graded", sub:"Kagoshima · K-2 plant",   t:"2026-06-24T02:00:00Z", est:true},
      {key:"packed",    lab:"Packed & chilled (0–4°C)", sub:"vacuum-sealed",           t:"2026-06-25T06:00:00Z", est:true},
      {key:"cargoin",   lab:"Received at Narita",       sub:"cargo-in · Jun 26",       t:"2026-06-26T01:00:00Z"},
      {key:"quar",      lab:"Animal quarantine cleared",sub:"Jun 29",                  t:"2026-06-29T02:00:00Z"},
      {key:"customs",   lab:"Customs cleared & loaded", sub:"Jun 30",                  t:"2026-06-30T10:00:00Z"},
      {key:"fly1",      lab:"In flight · EK319",        sub:"Narita → Dubai",          t:"2026-06-30T13:30:00Z", leg:0},
      {key:"transit",   lab:"Transit at Dubai",         sub:"DXB",                     t:"2026-07-01T00:05:00Z"},
      {key:"fly2",      lab:"In flight · EK143",        sub:"Dubai → Madrid",          t:"2026-07-01T10:20:00Z", leg:1},
      {key:"arr",       lab:"Arrived Madrid",           sub:"MAD",                     t:"2026-07-01T18:20:00Z"},
      {key:"deliver",   lab:"Import clearance & delivery", sub:"Jul 2",                t:"2026-07-02T09:00:00Z", est:true}
    ]
  }
};

var P = new URLSearchParams(location.search);
var ID = P.get("id") || "carnes-0626";
var S = SHIPMENTS[ID];
var BOXES_PER_PALLET = 24;            // company rule: 1 pallet per 24 boxes (round up)
var DEMO_T = "2026-07-01T15:30:00Z";
var now, mode;
if (P.get("live")!==null){ now = Date.now(); mode="live"; }
else if (P.get("t")){ now = Date.parse(P.get("t")); mode="scrub"; }
else { now = Date.parse(DEMO_T); mode="demo"; }

function rad(d){return d*Math.PI/180;} function deg(r){return r*180/Math.PI;}
function interp(a,b,f){
  var la1=rad(a[0]),lo1=rad(a[1]),la2=rad(b[0]),lo2=rad(b[1]);
  var d=2*Math.asin(Math.sqrt(Math.pow(Math.sin((la2-la1)/2),2)+Math.cos(la1)*Math.cos(la2)*Math.pow(Math.sin((lo2-lo1)/2),2)));
  if(!d) return a.slice();
  var A=Math.sin((1-f)*d)/Math.sin(d), B=Math.sin(f*d)/Math.sin(d);
  var x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
  var y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
  var z=A*Math.sin(la1)+B*Math.sin(la2);
  return [deg(Math.atan2(z,Math.sqrt(x*x+y*y))), deg(Math.atan2(y,x))];
}
function bearing(a,b){
  var la1=rad(a[0]),la2=rad(b[0]),dl=rad(b[1]-a[1]);
  var y=Math.sin(dl)*Math.cos(la2);
  var x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl);
  return (deg(Math.atan2(y,x))+360)%360;
}
function gcLine(a,b,n){var o=[];for(var i=0;i<=n;i++)o.push(interp(a,b,i/n));return o;}

function estimatePosition(){
  var legs=S.legs, firstDep=Date.parse(legs[0].dep), lastArr=Date.parse(legs[legs.length-1].arr);
  if(now < firstDep) return {phase:"prep", pos:AIRPORTS[legs[0].from].ll, head:0};
  if(now >= lastArr) return {phase:"done", pos:AIRPORTS[legs[legs.length-1].to].ll, head:0};
  for(var i=0;i<legs.length;i++){
    var dep=Date.parse(legs[i].dep), arr=Date.parse(legs[i].arr);
    var a=AIRPORTS[legs[i].from].ll, b=AIRPORTS[legs[i].to].ll;
    if(now>=dep && now<arr){
      var f=(now-dep)/(arr-dep);
      return {phase:"flying", legIdx:i, frac:f, pos:interp(a,b,f), head:bearing(interp(a,b,Math.max(0,f-0.02)),interp(a,b,Math.min(1,f+0.02)))};
    }
    if(i<legs.length-1 && now>=arr && now<Date.parse(legs[i+1].dep)) return {phase:"transit", at:legs[i].to, pos:b, head:0};
  }
  return {phase:"prep", pos:AIRPORTS[legs[0].from].ll, head:0};
}

function ico(name){
  var p={
    plane:'<path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L11 19v-5.5z"/>',
    pin:'<path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7m0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5"/>',
    check:'<path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4 12l5 5L20 6"/>',
    box:'<path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7zm0 2.3L17.7 7 12 9.7 6.3 7zM5 9l6 3v7l-6-3.3zm14 0v6.7L13 19v-7z"/>',
    shield:'<path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5z"/>',
    cert:'<path fill="currentColor" d="M4 4h16v12H4zM2 18h20v2H2z"/>',
    copy:'<path fill="none" stroke="currentColor" stroke-width="2" d="M9 9h11v11H9zM4 4h11v3M4 4v11h3"/>',
    tag:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>'
  };
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(p[name]||p.tag)+'</svg>';
}

var state = estimatePosition();
document.getElementById("ord").textContent = "order "+S.order;
document.getElementById("ordsub").textContent = S.buyer;
document.getElementById("awbf").textContent = "AWB "+S.awb+" · "+S.airline;
document.getElementById("heroIcon").innerHTML = ico("plane");

var dest = AIRPORTS[S.route[S.route.length-1]].name;
var statusText, subText, showEta=false;
if(state.phase==="prep"){ statusText="Preparing for departure"; subText="Departing "+AIRPORTS[S.legs[0].from].name+" ·"+S.etd.split("·")[1]+" · destination "+dest; }
else if(state.phase==="flying"){ var lg=S.legs[state.legIdx]; statusText="In flight"; subText=lg.flight+" · "+lg.carrier+" · "+AIRPORTS[lg.from].name+" → "+AIRPORTS[lg.to].name+" · "+Math.round(state.frac*100)+"% complete"; showEta=true; }
else if(state.phase==="transit"){ statusText="In transit"; subText="Connecting at "+AIRPORTS[state.at].name+" · next leg to "+dest; showEta=true; }
else { statusText="Delivered to "+dest; subText="Thank you for choosing Eda Wagyu"; }
document.getElementById("status").textContent = statusText;
document.getElementById("statusSub").textContent = subText;
if(showEta){ var e=document.getElementById("etaBox"); e.style.display="block"; e.innerHTML='<div class="k">Arriving</div><div class="v">'+S.eta+'</div>'; }
if(state.phase==="flying"||state.phase==="transit") document.getElementById("liveBadge").style.display="inline-flex";

/* current location bar */
function curLoc(){
  if(state.phase==="prep") return {ic:"pin", t:"Narita cargo terminal, Tokyo", n:"awaiting departure ·"+S.etd.split("·")[1]};
  if(state.phase==="flying"){ var lg=S.legs[state.legIdx]; return {ic:"plane", t:"In the air · "+lg.flight+" "+AIRPORTS[lg.from].city+" → "+AIRPORTS[lg.to].city, n:Math.round(state.frac*100)+"% complete · ETA "+S.eta}; }
  if(state.phase==="transit") return {ic:"pin", t:AIRPORTS[state.at].name+" airport", n:"in transit · awaiting next flight"};
  return {ic:"pin", t:dest, n:"delivered"};
}
var cl=curLoc();
document.getElementById("locbar").style.display="flex";
document.getElementById("locIcon").innerHTML=ico(cl.ic);
document.getElementById("locText").innerHTML=cl.t+' <span style="font-weight:400;color:var(--muted)">— '+cl.n+'</span>';

/* details card */
var legHtml="";
for(var i=0;i<S.legs.length;i++){
  var lg=S.legs[i], act=(state.phase==="flying"&&state.legIdx===i);
  legHtml+='<div class="leg'+(act?' act':'')+'">'+
    '<div class="top"><span class="fn">'+ico("plane")+lg.flight+'</span>'+
    '<a class="trk" href="'+lg.track+'" target="_blank" rel="noopener">track live ▸</a></div>'+
    '<div class="rt">'+AIRPORTS[lg.from].city+' ('+lg.from+') → '+AIRPORTS[lg.to].city+' ('+lg.to+')</div>'+
    '<div class="tm">'+lg.depDisp+' → '+lg.arrDisp+'</div></div>';
}
document.getElementById("detail").innerHTML =
  '<h3>Shipment details</h3>'+
  '<div class="fld"><span class="k">Air waybill</span><span class="v"><span class="awb" id="awbv">'+S.awb+
     ' <button class="cpy" id="cpy" aria-label="copy AWB">'+ico("copy")+'copy</button></span></span></div>'+
  '<div class="fld"><span class="k">Exporter</span><span class="v">'+S.exporter+'</span></div>'+
  '<div class="fld"><span class="k">Importer</span><span class="v">'+S.importer+'</span></div>'+
  '<div class="fld"><span class="k">Carrier</span><span class="v"><span class="carrier">'+ico("plane")+S.airline+'</span></span></div>'+
  '<div style="padding-top:10px"><div class="k" style="color:var(--muted);font-size:13.5px;margin-bottom:6px">Flights</div><div class="legs">'+legHtml+'</div></div>'+
  '<div class="fld"><span class="k">Cargo</span><span class="v">'+S.product+'</span></div>'+
  '<div class="fld"><span class="k">Pallets</span><span class="v">'+Math.ceil(S.boxes/BOXES_PER_PALLET)+' pallets</span></div>'+
  '<div class="fld"><span class="k">Boxes</span><span class="v">'+S.boxes+' boxes · '+S.temp+'</span></div>'+
  '<div class="fld"><span class="k">Departure (ETD)</span><span class="v">'+S.etd+'</span></div>'+
  '<div class="fld" style="border-bottom:none"><span class="k">Arrival (ETA)</span><span class="v">'+S.eta+'</span></div>';

document.getElementById("cpy").addEventListener("click",function(){
  var b=this; (navigator.clipboard?navigator.clipboard.writeText(S.awb):Promise.reject()).then(function(){
    b.innerHTML=ico("check")+"copied"; setTimeout(function(){b.innerHTML=ico("copy")+"copy";},1600);
  }).catch(function(){ b.innerHTML="select & copy"; });
});

/* provenance (no BMS) */
document.getElementById("prov").innerHTML =
  '<span>'+ico("box")+S.product+'</span>'+
  '<span>'+ico("shield")+'Certificate of origin ✓</span>'+
  '<span>'+ico("cert")+'Health certificate ✓</span>'+
  '<span>'+ico("tag")+'Cattle ID traceable</span>';

/* demo banner */
if(mode!=="live"){
  var d=document.getElementById("demo"); d.style.display="flex";
  var when=new Date(now).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  document.getElementById("demoTxt").innerHTML=(mode==="demo"?"Demo preview — simulated in-flight view":"Preview at "+when);
}

/* timeline (2-col on desktop, column-major) */
var tl=document.getElementById("tl"), html="", curIdx=-1, n=S.steps.length;
for(var i=0;i<n;i++){ if(now>=Date.parse(S.steps[i].t)) curIdx=i; }
var rows=Math.ceil(n/2);
for(var i=0;i<n;i++){
  var st=S.steps[i], cls, icon, isFlight=(st.key==="fly1"||st.key==="fly2"||st.key==="transit");
  if(i<curIdx){ cls="done"; icon=ico("check"); }
  else if(i===curIdx){ cls="active"; icon=ico(isFlight?"plane":"check"); }
  else { cls="pending"; icon=ico("tag"); }
  if(i===rows-1) cls+=" col-end";
  html+='<li class="'+cls+'"><span class="dot">'+icon+'</span>'+
        '<div class="lab">'+st.lab+(st.est?'<span class="est">est.</span>':'')+'</div>'+
        '<div class="sub">'+st.sub+'</div></li>';
}
tl.innerHTML=html;

/* map — no-label tiles (English-only = our own labels), tooltips auto-size (no clipping) */
var map=L.map("map",{zoomControl:true,scrollWheelZoom:false,attributionControl:true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:9,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);

var routePts=[];
for(var i=0;i<S.legs.length;i++){
  var a=AIRPORTS[S.legs[i].from].ll, b=AIRPORTS[S.legs[i].to].ll, line=gcLine(a,b,64), done=now>=Date.parse(S.legs[i].arr);
  L.polyline(line,{color:"#0F3D2E",weight:3,opacity:done?0.9:0.35,dashArray:done?null:"5 8"}).addTo(map)
    .bindTooltip(S.legs[i].flight,{permanent:true,direction:"center",className:"leg-tip"});
  routePts=routePts.concat(line);
}
S.route.forEach(function(code){
  L.circleMarker(AIRPORTS[code].ll,{radius:5,weight:2,color:"#0F3D2E",fillColor:"#ffffff",fillOpacity:1}).addTo(map)
    .bindTooltip(code,{permanent:true,direction:"bottom",offset:[0,7],className:"ap-tip"});
});
/* current-location marker (gold = clearly "now"; the Current location bar names it) */
if(state.phase==="flying"){
  var planeHtml='<div class="plane-i" style="transform:rotate('+state.head+'deg);color:#D4A93B;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">'+
    '<svg viewBox="0 0 24 24" width="36" height="36"><path fill="currentColor" stroke="#854F0B" stroke-width="0.5" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L11 19v-5.5z"/></svg></div>';
  L.marker(state.pos,{icon:L.divIcon({className:"",html:planeHtml,iconSize:[36,36],iconAnchor:[18,18]}),zIndexOffset:1000}).addTo(map);
} else {
  var pinHtml='<div style="color:#D4A93B;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))">'+
    '<svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" stroke="#854F0B" stroke-width="0.6" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7m0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5"/></svg></div>';
  L.marker(state.pos,{icon:L.divIcon({className:"",html:pinHtml,iconSize:[40,40],iconAnchor:[20,40]}),zIndexOffset:1000}).addTo(map);
}
setTimeout(function(){ map.fitBounds(L.latLngBounds(routePts).pad(0.15)); },60);

document.getElementById("mapNote").textContent=(mode==="live")
  ? "Estimated position from flight schedule · live ADS-B in next release"
  : "Estimated position from flight schedule (EK319 / EK143)";
</script>
</body>
</html>
