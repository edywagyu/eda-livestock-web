<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今週のごはん 写真候補（1料理3枚）</title>
<style>
  :root{--forest:#0F3D2E;--gold:#D4A93B;--cream:#FAF7F0;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:#1A1A1A;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.5;}
  header{background:var(--forest);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:10;}
  header h1{margin:0;font-size:18px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.85;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px;}
  .dish{background:#fff;border-radius:14px;padding:18px;margin-bottom:20px;box-shadow:0 2px 10px rgba(15,61,46,.06);}
  .dish h2{margin:0 0 4px;font-size:17px;color:var(--forest);}
  .dish .meta{font-size:12px;color:#5C5C5C;margin:0 0 14px;}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:720px){.row{grid-template-columns:1fr;}}
  .opt{border:2px solid #eee;border-radius:10px;overflow:hidden;background:#000;}
  .opt.cur{border-color:var(--gold);}
  .opt .imgbox{aspect-ratio:4/3;background:#111 center/cover no-repeat;}
  .opt .cap{background:#fff;padding:7px 10px;font-size:11.5px;color:#333;}
  .opt .tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--forest);border-radius:6px;padding:2px 7px;margin-right:5px;}
  .opt .tag.cur{background:var(--gold);color:var(--forest);}
  .legend{font-size:12px;color:#5C5C5C;margin:0 0 18px;}
  .cat{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;margin:26px 0 10px;}
</style>
</head>
<body>
<header>
  <h1>今週のごはん｜写真候補（各料理 A・B・C の3枚）</h1>

</header>
<div class="wrap">
  <p class="legend">※すべて調理後の料理写真。Pexels（商用フリー・クレジット不要）＋自社素材。表示されない画像があれば教えてください（別候補を探します）。</p>
  <div class="cat">── 和牛 ──</div>
  <div id="beef"></div>
  <div class="cat">── 鶏肉 ──</div>
  <div id="chicken"></div>
</div>

function render(list, mountId){
  const wrap = document.getElementById(mountId);
  list.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'dish';
    const opts = d.opts.map((o,i)=>{
      const letter = ['A','B','C'][i];
      return `<div class="opt${o.cur?' cur':''}">
        <div class="imgbox" style="background-image:url('${o.src}')"></div>
        <div class="cap"><span class="tag${o.cur?' cur':''}">${letter}${o.cur?'・現在':''}</span>${o.cap}</div>
      </div>`;
    }).join('');
    card.innerHTML = `<h2>${d.name}</h2><p class="meta">A・B・C から1枚選んでください</p><div class="row">${opts}</div>`;
    wrap.appendChild(card);
  });
}
render(DATA.beef,'beef');
