<style>
:root {

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {

body::before {

  z-index: 0;

.brand-lead {

/* ================ LINKS ================ */
.links { display: flex; flex-direction: column; gap: 14px; }
.link-card {
  display: flex;
  align-items: center;
  gap: 16px;

  background: rgba(250, 247, 240, 0.06);
  border: 1px solid rgba(212, 169, 59, 0.28);
  border-radius: 14px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: transform 0.4s var(--ease-out-expo), background 0.3s ease, border-color 0.3s ease;
}
.link-card:hover, .link-card:focus-visible {
  background: rgba(250, 247, 240, 0.11);
  border-color: var(--color-gold);
  transform: translateY(-2px);
  outline: none;
}
.link-icon {
  flex: 0 0 44px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(212, 169, 59, 0.14);
  color: var(--color-gold-bright);
}
.link-icon svg { width: 22px; height: 22px; display: block; }
.link-icon.is-line { background: #06C755; color: #FFFFFF; }
.link-icon.is-line svg { width: 26px; height: 26px; }
.link-body { flex: 1 1 auto; min-width: 0; display: block; }
.link-title {
  display: block;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.06em;
  margin: 0;
}
.link-desc {
  display: block;
  font-size: 12px;
  line-height: 1.6;
  color: rgba(250, 247, 240, 0.68);
  margin: 4px 0 0;
}
.link-arrow {
  flex: 0 0 auto;
  color: var(--color-gold);
  opacity: 0.7;
  transition: transform 0.4s var(--ease-out-expo), opacity 0.3s ease;
}
.link-card:hover .link-arrow { transform: translateX(4px); opacity: 1; }
.link-arrow svg { width: 16px; height: 16px; display: block; }

/* ================ FOOTER ================ */
.foot {
  margin-top: clamp(32px, 8vw, 48px);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: rgba(250, 247, 240, 0.45);
}
.foot p { margin: 0 0 6px; }
.foot .rule {
  width: 40px;
  height: 1px;
  background: rgba(212, 169, 59, 0.4);
  margin: 0 auto 16px;
}

@media (max-width: 380px) {
  .link-card { padding: 16px; gap: 13px; }
  .link-icon { flex-basis: 40px; width: 40px; height: 40px; }
  .link-title { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .link-card, .link-arrow { transition: none; }
}
</style>
